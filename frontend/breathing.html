<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEREVIA - Breathing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script src="app.js" defer></script>
    <style>
        :root {
            --mint: #a8f0d8;
            --sage: #6ec6a2;
            --lavender: #cbb8f5;
            --violet: #9b7fe8;
            --cream: #e8edf5;
            --text: #2c2438;
            --sub: #7b6f8a;
            --glass-bg: rgba(255, 255, 255, 0.42);
            --glass-border: rgba(255, 255, 255, 0.65);
            --shadow: 0 8px 32px rgba(100, 80, 140, 0.12);
        }
        body.dark {
            --cream: #0f0b1a;
            --text: #f0eaf8;
            --sub: #b0a0c8;
            --glass-bg: rgba(30, 24, 46, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--cream);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(168, 240, 216, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(203, 184, 245, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(246, 196, 212, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        h1, h2, h3, .nav-brand {
            font-family: 'DM Serif Display', serif;
        }

        /* Bubbles */
        .bubble {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1) 60%, transparent);
            box-shadow: 
                inset 0 0 20px rgba(255,255,255,0.5),
                inset 10px 0 40px rgba(168, 240, 216, 0.3),
                inset -10px 0 40px rgba(203, 184, 245, 0.3),
                0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(4px);
            z-index: -1;
            animation: floatBubble var(--duration, 15s) infinite ease-in-out alternate;
        }

        @keyframes floatBubble {
            0% { transform: translateY(0) translateX(0) rotate(0deg); }
            100% { transform: translateY(-100px) translateX(50px) rotate(360deg); }
        }

        /* Nav */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            color: var(--text);
            text-decoration: none;
        }
        .logo { width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .nav-link {
            color: var(--sub);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-link:hover, .nav-link.active { color: var(--text); }
        .nav-icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }
        .nav-icon-btn:hover {
            transform: rotate(15deg);
            background: var(--glass-bg);
        }

        /* Full Screen Meditation */
        .meditation-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            padding: 2rem;
            text-align: center;
        }

        .meditation-header {
            margin-bottom: 3rem;
            animation: cardEntrance 1s ease forwards;
        }
        .meditation-header h1 { font-size: 3rem; margin-bottom: 0.5rem; }
        .meditation-header p { font-size: 1.2rem; color: var(--sub); }

        .circle-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .circle-ring {
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid var(--glass-border);
            opacity: 0.3;
            transition: transform 4s linear;
        }
        
        .circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 2px solid var(--mint);
            box-shadow: 0 0 30px rgba(168, 240, 216, 0.4), inset 0 0 20px rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text);
            transition: transform 4s ease-in-out, box-shadow 4s ease;
            z-index: 10;
        }
        
        .circle.expand {
            transform: scale(1.4);
            box-shadow: 0 0 50px rgba(203, 184, 245, 0.6), inset 0 0 20px rgba(255,255,255,0.5);
            border-color: var(--lavender);
        }
        .circle.expand ~ .circle-ring {
            transform: scale(1.5);
            opacity: 0.1;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            animation: cardEntrance 1s ease forwards;
            animation-delay: 0.2s;
            opacity: 0;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }
        button:hover {
            transform: translateY(-2px);
            background: var(--violet);
            color: white;
            border-color: var(--violet);
        }

        .session-info {
            font-size: 1.1rem;
            color: var(--sub);
            background: var(--glass-bg);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            animation: cardEntrance 1s ease forwards;
            animation-delay: 0.3s;
            opacity: 0;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Bubbles -->
    <div class="bubble" style="width:120px; height:120px; top:15%; left:10%; --duration: 12s;"></div>
    <div class="bubble" style="width:80px; height:80px; top:25%; left:80%; --duration: 15s;"></div>
    <div class="bubble" style="width:60px; height:60px; top:75%; left:20%; --duration: 18s;"></div>
    <div class="bubble" style="width:140px; height:140px; top:80%; left:75%; --duration: 22s;"></div>
    <div class="bubble" style="width:50px; height:50px; top:45%; left:85%; --duration: 14s;"></div>
    <div class="bubble" style="width:90px; height:90px; top:65%; left:10%; --duration: 17s;"></div>

    <nav class="top-nav">
        <a class="nav-brand" href="dashboard.html">
            <img class="logo" src="Mental Health Tracker LOGO.png" alt="CEREVIA" onerror="this.style.display='none'">
            CEREVIA
        </a>
        <div class="nav-right">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="mood.html" class="nav-link">Mood</a>
            <a href="journal.html" class="nav-link">Journal</a>
            <a href="settings.html" class="nav-link">Settings</a>
            <button class="nav-icon-btn" onclick="toggleThemeFromSettings()" title="Toggle theme">🌓</button>
        </div>
    </nav>

    <div class="meditation-container">
        <div class="meditation-header">
            <h1>Breathing Practice ✦</h1>
            <p>Follow the rhythm and relax 🌿</p>
        </div>

        <div class="circle-container">
            <div class="circle" id="circle">Ready</div>
            <div class="circle-ring"></div>
        </div>

        <div class="controls">
            <button onclick="startBreathing()">▶ Start</button>
            <button onclick="stopBreathing()">⏸ Stop</button>
            <button onclick="resetSessions()">↺ Reset</button>
        </div>

        <div class="session-info">
            Completed Cycles: <span id="sessionCount">0</span>
        </div>
    </div>

    <script>
        let interval = null;
        let phaseIndex = 0;
        let cycleTracker = 0;
        let sessions = parseInt(localStorage.getItem('breathingSessions')) || 0;
        const phases = ['Inhale', 'Hold', 'Exhale', 'Hold'];
        const durations = [4000, 4000, 4000, 4000];

        document.getElementById('sessionCount').innerText = sessions;

        function startBreathing() {
            if (interval) return;
            function runPhase() {
                const circle = document.getElementById('circle');
                circle.innerText = phases[phaseIndex];
                if (phaseIndex === 0) {
                    circle.classList.add('expand');
                }
                if (phaseIndex === 2) {
                    circle.classList.remove('expand');
                    cycleTracker++;
                    if (cycleTracker === 1) {
                        sessions++;
                        localStorage.setItem('breathingSessions', sessions);
                        document.getElementById('sessionCount').innerText = sessions;
                        cycleTracker = 0;
                    }
                }
                phaseIndex = (phaseIndex + 1) % phases.length;
            }
            runPhase();
            interval = setInterval(runPhase, 4000);
        }

        function stopBreathing() {
            clearInterval(interval);
            interval = null;
            phaseIndex = 0;
            cycleTracker = 0;
            const circle = document.getElementById('circle');
            circle.classList.remove('expand');
            circle.innerText = 'Paused';
        }

        function resetSessions() {
            sessions = 0;
            localStorage.setItem('breathingSessions', 0);
            document.getElementById('sessionCount').innerText = 0;
        }

        document.addEventListener('DOMContentLoaded', function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') document.body.classList.add('dark');
        });
    </script>
</body>
</html>
