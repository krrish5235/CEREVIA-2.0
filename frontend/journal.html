<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEREVIA - Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <script src="app.js" defer></script>
    <style>
        :root {
            --mint: #a8f0d8;
            --sage: #6ec6a2;
            --lavender: #cbb8f5;
            --violet: #9b7fe8;
            --cream: #e8edf5;
            --text: #2c2438;
            --sub: #7b6f8a;
            --glass-bg: rgba(255, 255, 255, 0.42);
            --glass-border: rgba(255, 255, 255, 0.65);
            --shadow: 0 8px 32px rgba(100, 80, 140, 0.12);
        }
        body.dark {
            --cream: #0f0b1a;
            --text: #f0eaf8;
            --sub: #b0a0c8;
            --glass-bg: rgba(30, 24, 46, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--cream);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(168, 240, 216, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(203, 184, 245, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(246, 196, 212, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        h1, h2, h3, .nav-brand {
            font-family: 'DM Serif Display', serif;
        }

        /* Bubbles */
        .bubble {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.1) 60%, transparent);
            box-shadow: 
                inset 0 0 20px rgba(255,255,255,0.5),
                inset 10px 0 40px rgba(168, 240, 216, 0.3),
                inset -10px 0 40px rgba(203, 184, 245, 0.3),
                0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(4px);
            z-index: -1;
            animation: floatBubble var(--duration, 15s) infinite ease-in-out alternate;
        }

        @keyframes floatBubble {
            0% { transform: translateY(0) translateX(0) rotate(0deg); }
            100% { transform: translateY(-100px) translateX(50px) rotate(360deg); }
        }

        /* Nav */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            color: var(--text);
            text-decoration: none;
        }
        .logo { width: 32px; height: 32px; }
        .nav-right { display: flex; align-items: center; gap: 1.5rem; }
        .nav-link {
            color: var(--sub);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        .nav-link:hover, .nav-link.active { color: var(--text); }
        .nav-icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: transform 0.3s, background 0.3s;
        }
        .nav-icon-btn:hover {
            transform: rotate(15deg);
            background: var(--glass-bg);
        }

        /* Perspective Container */
        .perspective-container {
            perspective: 1000px;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow);
            transform-style: preserve-3d;
            animation: cardEntrance 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateZ(-40px);
        }
        .glass-card:nth-child(2) { animation-delay: 0.1s; }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateZ(0);
            }
        }

        /* Journal Page Specific */
        .journal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .mood-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .mood-chip {
            padding: 8px 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        .mood-chip:hover, .mood-chip.selected {
            background: var(--violet);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(155, 127, 232, 0.3);
            border-color: var(--violet);
        }

        .input-area textarea {
            width: 100%;
            height: 250px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            font-family: inherit;
            font-size: 1.1rem;
            color: var(--text);
            resize: none;
            margin-bottom: 0.5rem;
            transition: background 0.3s, border-color 0.3s;
        }
        body.dark .input-area textarea {
            background: rgba(0, 0, 0, 0.2);
        }
        .input-area textarea:focus {
            outline: none;
            border-color: var(--violet);
            background: rgba(255, 255, 255, 0.3);
        }
        body.dark .input-area textarea:focus { background: rgba(0, 0, 0, 0.4); }
        
        .char-counter {
            text-align: right;
            font-size: 0.9rem;
            color: var(--sub);
            margin-bottom: 1.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
        }
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        button.primary {
            background: var(--text);
            color: var(--cream);
        }
        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        button.secondary {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text);
        }
        button.secondary:hover {
            background: rgba(255, 0, 0, 0.1);
            color: #d94848;
            border-color: #d94848;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            color: var(--text);
            font-family: inherit;
            margin-bottom: 1.5rem;
        }
        
        .journal-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .journal-list::-webkit-scrollbar { width: 6px; }
        .journal-list::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        
        .journal-entry {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.2rem;
            transition: transform 0.3s;
        }
        .journal-entry:hover {
            transform: translateX(5px);
            border-color: var(--violet);
        }

        @media (max-width: 768px) {
            .perspective-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Bubbles -->
    <div class="bubble" style="width:100px; height:100px; top:10%; left:10%; --duration: 12s;"></div>
    <div class="bubble" style="width:80px; height:80px; top:20%; left:80%; --duration: 15s;"></div>
    <div class="bubble" style="width:60px; height:60px; top:70%; left:20%; --duration: 18s;"></div>
    <div class="bubble" style="width:120px; height:120px; top:80%; left:70%; --duration: 20s;"></div>
    <div class="bubble" style="width:50px; height:50px; top:40%; left:40%; --duration: 14s;"></div>
    <div class="bubble" style="width:90px; height:90px; top:60%; left:85%; --duration: 16s;"></div>
    <div class="bubble" style="width:70px; height:70px; top:85%; left:15%; --duration: 19s;"></div>
    <div class="bubble" style="width:40px; height:40px; top:15%; left:60%; --duration: 13s;"></div>

    <nav class="top-nav">
        <a class="nav-brand" href="dashboard.html">
            <img class="logo" src="Mental Health Tracker LOGO.png" alt="CEREVIA" onerror="this.style.display='none'">
            CEREVIA
        </a>
        <div class="nav-right">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="mood.html" class="nav-link">Mood</a>
            <a href="journal.html" class="nav-link active">Journal</a>
            <a href="settings.html" class="nav-link">Settings</a>
            <button class="nav-icon-btn" onclick="toggleThemeFromSettings()" title="Toggle theme">🌓</button>
        </div>
    </nav>

    <div class="perspective-container">
        <!-- LEFT COLUMN -->
        <div class="glass-card">
            <div class="journal-header">
                <h2>What's on your mind? ✦</h2>
                <p id="entryDateLabel" style="color: var(--sub); font-size: 0.9rem;"></p>
            </div>
            
            <div class="mood-chips" id="moodRow">
                <span class="mood-chip" onclick="selectMood(this)">😊 Happy</span>
                <span class="mood-chip" onclick="selectMood(this)">😔 Sad</span>
                <span class="mood-chip" onclick="selectMood(this)">😰 Anxious</span>
                <span class="mood-chip" onclick="selectMood(this)">😌 Calm</span>
                <span class="mood-chip" onclick="selectMood(this)">🔥 Motivated</span>
                <span class="mood-chip" onclick="selectMood(this)">😴 Tired</span>
            </div>

            <div class="input-area">
                <textarea id="entry" placeholder="Pour your thoughts here..." oninput="updateCharCount(this)" maxlength="1000"></textarea>
                <p id="charCount" class="char-counter">0 / 1000</p>
            </div>

            <div class="btn-group">
                <button class="primary" onclick="saveJournal()">✦ Save Entry</button>
                <button class="secondary" onclick="resetJournal()">🗑 Reset</button>
            </div>
        </div>

        <!-- RIGHT COLUMN -->
        <div class="glass-card">
            <div class="journal-header">
                <h2>Previous Entries <span id="entryCountBadge" style="font-size:1rem; padding:2px 10px; background:var(--violet); color:white; border-radius:12px; vertical-align:middle; margin-left:10px;">0</span></h2>
            </div>
            
            <input type="text" class="search-bar" placeholder="🔍 Search entries…" oninput="filterEntries(this.value)">
            
            <div id="journalList" class="journal-list">
                <div style="text-align:center; padding: 2rem; color: var(--sub);">
                    📖 Start writing to see your entries here
                </div>
            </div>
        </div>
    </div>

    <script>
        function setDateLabel() {
            const el = document.getElementById('entryDateLabel');
            if (el) el.textContent = new Date().toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
        }
        function selectMood(el) {
            document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }
        function updateCharCount(el) {
            const counter = document.getElementById('charCount');
            if (counter) {
                const len = el.value.length;
                counter.textContent = len + ' / 1000';
                counter.style.color = len > 900 ? '#e05050' : 'var(--sub)';
            }
        }
        function filterEntries(query) {
            const q = query.toLowerCase();
            document.querySelectorAll('.journal-entry').forEach(e => {
                e.style.display = e.textContent.toLowerCase().includes(q) ? '' : 'none';
            });
        }
        function saveJournal() {
            // Mock save function
            alert("Journal saved (mock)!");
        }
        function resetJournal() {
            document.getElementById('entry').value = '';
            updateCharCount(document.getElementById('entry'));
            document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('selected'));
        }
        function loadJournal() {
            // Mock load
        }
        function restoreTheme() {
            if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
        }
        window.onload = function() {
            restoreTheme();
            setDateLabel();
            loadJournal();
        };
    </script>
</body>
</html>
