<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mood Tracker</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage:     #6ec6a2;
            --lavender: #cbb8f5;
            --violet:   #9b7fe8;
            --cream:    #fef9f4;
            --text:     #2c2438;
            --sub:      #7b6f8a;
            --glass:    rgba(255,255,255,0.55);
            --shadow:   0 20px 60px rgba(100,80,140,0.14);
            --radius-lg: 26px;
            --radius-md: 16px;
            --trans:    0.35s cubic-bezier(.4,0,.2,1);
            --font-display: 'DM Serif Display', serif;
            --font-body:    'DM Sans', sans-serif;
        }
        body.dark {
            --cream:  #16121f;
            --text:   #f0eaf8;
            --sub:    #b0a0c8;
            --glass:  rgba(30,24,46,0.62);
            --shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--trans), color var(--trans);
            animation: pageFadeIn 0.5s ease both;
            padding-bottom: 80px;
        }

        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── Blobs ── */
        .bg-wrap { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: blobDrift 16s ease-in-out infinite; }
        .blob-1 { width: 580px; height: 580px; background: #c3f4e4; top: -180px; left: -140px; }
        .blob-2 { width: 460px; height: 460px; background: #e4d4fc; bottom: -120px; right: -100px; animation-delay: -6s; }
        .blob-3 { width: 360px; height: 360px; background: #fcd4e8; top: 42%; left: 54%; animation-delay: -11s; }
        body.dark .blob-1 { background: #112e42; opacity: 0.55; }
        body.dark .blob-2 { background: #28144c; opacity: 0.55; }
        body.dark .blob-3 { background: #3a1228; opacity: 0.45; }
        @keyframes blobDrift {
            0%,100% { transform: translate(0,0) scale(1); }
            33%      { transform: translate(28px,-22px) scale(1.04); }
            66%      { transform: translate(-18px,22px) scale(0.97); }
        }

        /* ── Nav ── */
        .top-nav {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(180,160,220,0.18);
            box-shadow: 0 4px 24px rgba(100,80,140,0.07);
        }
        body.dark .top-nav { background: rgba(22,18,31,0.72); border-bottom-color: rgba(255,255,255,0.07); }

        .nav-logo {
            font-family: var(--font-display); font-size: 21px; color: var(--text);
            letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .nav-logo-icon .logo{
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
        }
        .nav-right { display: flex; align-items: center; gap: 8px; }
        .nav-back {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 18px; border-radius: 50px;
            border: 1.5px solid rgba(180,160,220,0.25);
            background: rgba(255,255,255,0.4);
            color: var(--text); font-size: 13.5px; font-weight: 600;
            font-family: var(--font-body); cursor: pointer; transition: var(--trans);
            text-decoration: none; backdrop-filter: blur(10px);
        }
        body.dark .nav-back { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.1); }
        .nav-back:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(100,80,140,0.14); }

        .dark-toggle input { display: none; }
        .dark-toggle label {
            width: 48px; height: 26px; background: rgba(180,160,220,0.25);
            border: 1.5px solid rgba(180,160,220,0.4); display: block; border-radius: 50px;
            position: relative; cursor: pointer; transition: var(--trans);
        }
        .dark-toggle label::before {
            content: "☀️"; font-size: 11px; width: 20px; height: 20px; background: white;
            position: absolute; top: 2px; left: 2px; border-radius: 50%; transition: var(--trans);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .dark-toggle input:checked + label { background: rgba(106,17,203,0.35); border-color: rgba(106,17,203,0.5); }
        .dark-toggle input:checked + label::before { content: "🌙"; transform: translateX(22px); }

        /* ── Page Layout ── */
        .page-wrap {
            position: relative; z-index: 10;
            max-width: 1100px; margin: 0 auto;
            padding: 40px 36px 0;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 24px;
            align-items: start;
        }

        .page-header { grid-column: span 2; margin-bottom: 8px; }
        .page-greeting { font-size: 13px; font-weight: 600; letter-spacing: 0.7px; text-transform: uppercase; color: var(--sub); margin-bottom: 6px; }
        .page-title { font-family: var(--font-display); font-size: 36px; color: var(--text); letter-spacing: -0.8px; line-height: 1.1; }
        .page-title span {
            background: linear-gradient(135deg, var(--sage), var(--violet));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        /* ── Panel ── */
        .panel {
            background: var(--glass); border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.65);
            box-shadow: var(--shadow); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); overflow: hidden;
            animation: cardFadeIn 0.6s ease both; transition: box-shadow var(--trans);
        }
        body.dark .panel { border-color: rgba(255,255,255,0.09); background: rgba(30,24,46,0.62); }
        .panel:hover { box-shadow: 0 28px 64px rgba(100,80,140,0.18); }
        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .panel-header {
            padding: 22px 26px 16px;
            border-bottom: 1px solid rgba(180,160,220,0.14);
        }
        body.dark .panel-header { border-bottom-color: rgba(255,255,255,0.07); }
        .panel-label {
            font-size: 11.5px; font-weight: 700; letter-spacing: 0.9px;
            text-transform: uppercase; color: var(--sub);
            display: flex; align-items: center; gap: 6px; margin-bottom: 5px;
        }
        .panel-label-dot { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, var(--sage), var(--violet)); }
        .panel-title { font-family: var(--font-display); font-size: 20px; color: var(--text); }

        /* ── Mood Picker ── */
        .mood-section { padding: 20px 26px; }

        .mood-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .mood-btn {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            padding: 14px 8px;
            border-radius: 16px;
            border: 1.5px solid rgba(180,160,220,0.18);
            background: rgba(255,255,255,0.45);
            cursor: pointer; transition: var(--trans);
            user-select: none; outline: none;
        }
        body.dark .mood-btn { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.09); }

        .mood-btn:hover { transform: translateY(-3px); border-color: rgba(203,184,245,0.4); box-shadow: 0 8px 20px rgba(100,80,140,0.12); }

        .mood-btn.selected {
            border-color: transparent;
            box-shadow: 0 0 0 2px var(--violet), 0 10px 24px rgba(155,127,232,0.25);
        }

        .mood-emoji { font-size: 28px; line-height: 1; transition: transform var(--trans); }
        .mood-btn:hover .mood-emoji, .mood-btn.selected .mood-emoji { transform: scale(1.18); }
        .mood-name { font-size: 11px; font-weight: 700; color: var(--sub); letter-spacing: 0.3px; transition: color var(--trans); }
        .mood-btn.selected .mood-name { color: var(--violet); }

        /* Each mood color */
        .mood-btn[data-mood="Happy"].selected    { background: rgba(255,220,100,0.18); box-shadow: 0 0 0 2px #f5c542, 0 10px 24px rgba(245,197,66,0.22); }
        .mood-btn[data-mood="Calm"].selected     { background: rgba(100,210,180,0.18); box-shadow: 0 0 0 2px #6ec6a2, 0 10px 24px rgba(110,198,162,0.22); }
        .mood-btn[data-mood="Neutral"].selected  { background: rgba(180,160,220,0.18); box-shadow: 0 0 0 2px #9b7fe8, 0 10px 24px rgba(155,127,232,0.22); }
        .mood-btn[data-mood="Sad"].selected      { background: rgba(100,160,240,0.18); box-shadow: 0 0 0 2px #5a9ef5, 0 10px 24px rgba(90,158,245,0.22); }
        .mood-btn[data-mood="Anxious"].selected  { background: rgba(240,140,100,0.18); box-shadow: 0 0 0 2px #f5885a, 0 10px 24px rgba(245,136,90,0.22); }
        .mood-btn[data-mood="Angry"].selected    { background: rgba(240,90,90,0.18);   box-shadow: 0 0 0 2px #e05555, 0 10px 24px rgba(220,80,80,0.22); }

        /* Level slider */
        .level-section { margin-bottom: 24px; }

        .level-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .level-label { font-size: 13px; font-weight: 600; color: var(--sub); }
        .level-value {
            font-family: var(--font-display); font-size: 28px;
            background: linear-gradient(135deg, var(--sage), var(--violet));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .slider-wrap { position: relative; padding: 6px 0; }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%; height: 6px;
            border-radius: 4px; outline: none; border: none; padding: 0;
            background: linear-gradient(90deg, var(--sage) 0%, var(--violet) 100%);
            cursor: pointer; box-shadow: none; margin: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: white;
            border: 3px solid var(--violet);
            box-shadow: 0 4px 12px rgba(155,127,232,0.4);
            transition: transform var(--trans);
            cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.2); }

        .slider-ticks {
            display: flex; justify-content: space-between;
            margin-top: 8px; padding: 0 2px;
        }
        .tick { font-size: 10.5px; color: var(--sub); font-weight: 600; }

        /* Note field */
        .note-label { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 8px; display: block; }
        textarea.note-field {
            width: 100%; height: 80px; resize: none;
            border: 1.5px solid rgba(180,160,220,0.2);
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.5);
            color: var(--text); font-family: var(--font-body);
            font-size: 14px; padding: 12px 14px; outline: none;
            transition: var(--trans);
        }
        body.dark textarea.note-field { background: rgba(255,255,255,0.07); }
        textarea.note-field::placeholder { color: var(--sub); font-weight: 400; }
        textarea.note-field:focus {
            border-color: var(--lavender);
            box-shadow: 0 0 0 3px rgba(203,184,245,0.2);
            background: rgba(255,255,255,0.85);
        }
        body.dark textarea.note-field:focus { background: rgba(255,255,255,0.12); }

        /* Action row */
        .mood-action-row {
            display: flex; gap: 10px;
            padding: 16px 26px 24px;
            border-top: 1px solid rgba(180,160,220,0.12);
        }
        body.dark .mood-action-row { border-top-color: rgba(255,255,255,0.06); }

        .btn-save {
            flex: 1; padding: 14px; border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--sage), var(--violet));
            color: white; font-family: var(--font-body);
            font-size: 15px; font-weight: 700; cursor: pointer;
            transition: var(--trans); box-shadow: 0 8px 24px rgba(110,198,162,0.32);
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(110,198,162,0.44); }
        .btn-save:active { transform: translateY(0); }

        .btn-reset {
            padding: 14px 18px;
            border: 1.5px solid rgba(220,80,80,0.22);
            border-radius: var(--radius-md);
            background: rgba(220,80,80,0.08);
            color: #c04040; font-family: var(--font-body);
            font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--trans);
        }
        .btn-reset:hover { background: rgba(220,80,80,0.16); transform: translateY(-1px); }

        /* ── History Panel ── */
        .history-panel { animation-delay: .1s; }

        .history-header { display: flex; align-items: center; justify-content: space-between; }
        .entry-count-badge {
            padding: 4px 12px;
            background: linear-gradient(135deg, rgba(168,240,216,0.35), rgba(203,184,245,0.35));
            border: 1px solid rgba(180,160,220,0.2); border-radius: 50px;
            font-size: 12px; font-weight: 700; color: var(--text);
        }

        /* Filter row */
        .filter-row {
            display: flex; gap: 8px; padding: 14px 22px;
            border-bottom: 1px solid rgba(180,160,220,0.1);
            overflow-x: auto; flex-wrap: wrap;
        }
        body.dark .filter-row { border-bottom-color: rgba(255,255,255,0.06); }

        .filter-chip {
            padding: 5px 14px; border-radius: 50px;
            border: 1.5px solid rgba(180,160,220,0.2);
            background: rgba(255,255,255,0.45);
            font-size: 12.5px; font-weight: 600; color: var(--sub);
            cursor: pointer; transition: var(--trans); white-space: nowrap;
        }
        body.dark .filter-chip { background: rgba(255,255,255,0.07); }
        .filter-chip:hover { border-color: var(--lavender); color: var(--text); }
        .filter-chip.active {
            background: linear-gradient(135deg, rgba(168,240,216,0.4), rgba(203,184,245,0.4));
            border-color: var(--lavender); color: var(--text);
        }

        /* List */
        .mood-list-wrap {
            max-height: 500px; overflow-y: auto;
            padding: 14px 22px 22px;
            display: flex; flex-direction: column; gap: 10px;
        }

        .mood-entry {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 16px;
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(180,160,220,0.15);
            border-radius: 18px; transition: var(--trans);
            animation: entrySlide 0.4s ease both;
            cursor: default;
        }
        body.dark .mood-entry { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.08); }
        .mood-entry:hover { transform: translateX(4px); border-color: rgba(203,184,245,0.35); box-shadow: 0 6px 20px rgba(100,80,140,0.1); }

        @keyframes entrySlide {
            from { opacity: 0; transform: translateX(-12px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .entry-emoji-badge {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; flex-shrink: 0;
        }

        .entry-body { flex: 1; min-width: 0; }
        .entry-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
        .entry-mood-name { font-size: 14px; font-weight: 700; color: var(--text); }
        .entry-date { font-size: 11px; font-weight: 600; color: var(--sub); letter-spacing: 0.3px; }
        .entry-note { font-size: 12.5px; color: var(--sub); line-height: 1.4; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        .level-pill {
            padding: 4px 12px; border-radius: 50px;
            font-size: 13px; font-weight: 800;
            flex-shrink: 0;
        }

        .entry-delete {
            background: none; border: none; font-size: 15px;
            cursor: pointer; opacity: 0.4; transition: var(--trans);
            padding: 4px; border-radius: 6px; flex-shrink: 0;
        }
        .entry-delete:hover { opacity: 1; background: rgba(220,80,80,0.1); }

        /* Empty state */
        .empty-state { text-align: center; padding: 48px 20px; color: var(--sub); }
        .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
        .empty-text { font-size: 14px; line-height: 1.6; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(180,160,220,0.28); border-radius: 8px; }

        /* ── Popup ── */
        .popup {
            position: fixed; bottom: 32px; left: 50%;
            transform: translateX(-50%) translateY(20px);
            padding: 13px 30px;
            background: linear-gradient(135deg, var(--sage), var(--violet));
            color: white; border-radius: 50px; font-size: 14px; font-weight: 600;
            box-shadow: 0 14px 34px rgba(110,198,162,0.38); opacity: 0;
            transition: 0.45s cubic-bezier(.34,1.56,.64,1);
            z-index: 9999; pointer-events: none;
        }
        .popup.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<!-- Blobs -->
<div class="bg-wrap">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>

<!-- Nav -->
<nav class="top-nav">
    <a class="nav-logo" href="dashboard.html">
        <div class="nav-logo-icon"><img class="logo" src="Mental Health Tracker LOGO.png" alt="C" srcset=""></div>
        CEREVIA
    </div>
    </a>
    <div class="nav-right">
        <a class="nav-back" href="dashboard.html">← Dashboard</a>
        <div class="dark-toggle">
            <input type="checkbox" id="darkSwitch" onclick="toggleDarkMode()">
            <label for="darkSwitch"></label>
        </div>
    </div>
</nav>

<!-- Page -->
<div class="page-wrap">

    <!-- Header -->
    <div class="page-header">
        <p class="page-greeting">Check in with yourself 🌈</p>
        <h1 class="page-title">Mood <span>Tracker</span></h1>
    </div>

    <!-- Log Mood Panel -->
    <div class="panel" style="animation-delay:.05s">
        <div class="panel-header">
            <div class="panel-label">
                <span class="panel-label-dot"></span> Today's Check-in
            </div>
            <div class="panel-title">How are you feeling?</div>
        </div>

        <div class="mood-section">

            <!-- Mood grid -->
            <div class="mood-grid" id="moodGrid">
                <button class="mood-btn" data-mood="Happy"   onclick="selectMood(this)"><span class="mood-emoji">😊</span><span class="mood-name">Happy</span></button>
                <button class="mood-btn" data-mood="Calm"    onclick="selectMood(this)"><span class="mood-emoji">😌</span><span class="mood-name">Calm</span></button>
                <button class="mood-btn" data-mood="Neutral" onclick="selectMood(this)"><span class="mood-emoji">😐</span><span class="mood-name">Neutral</span></button>
                <button class="mood-btn" data-mood="Sad"     onclick="selectMood(this)"><span class="mood-emoji">😔</span><span class="mood-name">Sad</span></button>
                <button class="mood-btn" data-mood="Anxious" onclick="selectMood(this)"><span class="mood-emoji">😰</span><span class="mood-name">Anxious</span></button>
                <button class="mood-btn" data-mood="Angry"   onclick="selectMood(this)"><span class="mood-emoji">😡</span><span class="mood-name">Angry</span></button>
            </div>

            <!-- Level slider -->
            <div class="level-section">
                <div class="level-header">
                    <span class="level-label">Intensity Level</span>
                    <span class="level-value" id="levelDisplay">5</span>
                </div>
                <div class="slider-wrap">
                    <input
                        type="range"
                        id="level"
                        min="1" max="10" value="5"
                        oninput="document.getElementById('levelDisplay').textContent = this.value"
                    >
                </div>
                <div class="slider-ticks">
                    <span class="tick">1</span><span class="tick">2</span><span class="tick">3</span>
                    <span class="tick">4</span><span class="tick">5</span><span class="tick">6</span>
                    <span class="tick">7</span><span class="tick">8</span><span class="tick">9</span>
                    <span class="tick">10</span>
                </div>
            </div>

            <!-- Note -->
            <label class="note-label">Add a note <span style="opacity:.5;font-weight:400">(optional)</span></label>
            <textarea class="note-field" id="moodNote" placeholder="What's behind this feeling?…"></textarea>

            <!-- Hidden select kept for app.js compatibility -->
            <select id="moodSelect" style="display:none"></select>
        </div>

        <div class="mood-action-row">
            <button class="btn-save" onclick="addMood()">✦ Save Mood</button>
            <button class="btn-reset" onclick="resetMood()" title="Clear all entries">🗑 Reset</button>
        </div>
    </div>

    <!-- History Panel -->
    <div class="panel history-panel">
        <div class="panel-header">
            <div class="panel-label"><span class="panel-label-dot"></span> History</div>
            <div class="history-header">
                <div class="panel-title">Mood Log</div>
                <span class="entry-count-badge" id="moodCountBadge">0 entries</span>
            </div>
        </div>

        <!-- Filter chips -->
        <div class="filter-row" id="filterRow">
            <span class="filter-chip active" onclick="filterMoods('all', this)">All</span>
            <span class="filter-chip" onclick="filterMoods('Happy', this)">😊 Happy</span>
            <span class="filter-chip" onclick="filterMoods('Calm', this)">😌 Calm</span>
            <span class="filter-chip" onclick="filterMoods('Neutral', this)">😐 Neutral</span>
            <span class="filter-chip" onclick="filterMoods('Sad', this)">😔 Sad</span>
            <span class="filter-chip" onclick="filterMoods('Anxious', this)">😰 Anxious</span>
            <span class="filter-chip" onclick="filterMoods('Angry', this)">😡 Angry</span>
        </div>

        <div class="mood-list-wrap" id="moodList">
            <div class="empty-state">
                <div class="empty-icon">🌱</div>
                <p class="empty-text">No moods logged yet.<br>Your first check-in is the start of something good.</p>
            </div>
        </div>
    </div>

</div>

<div id="popup" class="popup"></div>

<script src="app.js" defer></script>
<script>
    /* ── Mood meta ── */
    const MOOD_META = {
        Happy:   { emoji:'😊', bg:'rgba(255,220,100,0.18)', pill:'#f5c542', text:'#7a5c00' },
        Calm:    { emoji:'😌', bg:'rgba(100,210,180,0.18)', pill:'#6ec6a2', text:'#1a5e44' },
        Neutral: { emoji:'😐', bg:'rgba(180,160,220,0.18)', pill:'#9b7fe8', text:'#3e2a70' },
        Sad:     { emoji:'😔', bg:'rgba(100,160,240,0.18)', pill:'#5a9ef5', text:'#1a3870' },
        Anxious: { emoji:'😰', bg:'rgba(240,140,100,0.18)', pill:'#f5885a', text:'#7a2e00' },
        Angry:   { emoji:'😡', bg:'rgba(240,90,90,0.18)',   pill:'#e05555', text:'#6e0000' },
    };

    let currentMood = null;

    function selectMood(btn) {
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        currentMood = btn.dataset.mood;
        // sync hidden select for app.js
        const sel = document.getElementById('moodSelect');
        if (sel) {
            let opt = [...sel.options].find(o => o.value === currentMood || o.text === currentMood);
            if (!opt) { opt = new Option(currentMood, currentMood); sel.add(opt); }
            sel.value = currentMood;
        }
    }

    function filterMoods(mood, el) {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.querySelectorAll('.mood-entry').forEach(e => {
            e.style.display = (mood === 'all' || e.dataset.mood === mood) ? '' : 'none';
        });
    }

    /* ── Theme ── */
    function syncThemeToggle() {
        const sw = document.getElementById('darkSwitch');
        if (sw) sw.checked = document.body.classList.contains('dark');
    }

    function toggleDarkMode() {
        const nextTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
        if (typeof setTheme === 'function') {
            setTheme(nextTheme);
        } else {
            document.body.classList.toggle('dark', nextTheme === 'dark');
            localStorage.setItem('theme', nextTheme);
            syncThemeToggle();
        }
    }
    function restoreTheme() {
        const isDark = localStorage.getItem('theme') === 'dark';
        document.body.classList.toggle('dark', isDark);
        syncThemeToggle();
    }

    window.addEventListener('storage', function (event) {
        if (event.key === 'theme') restoreTheme();
    });

    /* ── Popup ── */
    function showPopup(msg) {
        const p = document.getElementById('popup');
        p.textContent = msg; p.classList.add('show');
        setTimeout(() => p.classList.remove('show'), 2800);
    }

    window.onload = function () {
        restoreTheme();
        if (typeof loadMoods === 'function') loadMoods();
    };
</script>
</body>
</html>
